name: screenshots

# The Play Store screenshots (a 16:9 phone, 1080 x 1920, English): an Ortus
# at the pinned program commit, filled with the sample organisation
# (tools/sample-org.mjs), the app signed in as its owner, StoreScreenshots
# taking each screen. Run by hand; the PNGs are the artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: The program commit
        id: pin
        run: echo "ortus=$(sed -n 's/^ortus = "\([0-9a-f]\{40\}\)"$/\1/p' pins.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Ortus-Sovereign-Cloud/ortus
          ref: ${{ steps.pin.outputs.ortus }}
          path: program
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            program/target
          key: ortus-linux-${{ hashFiles('program/pins.toml', 'program/Cargo.lock') }}
          restore-keys: ortus-linux-
      - name: Build Ortus
        run: |
          cd program
          ci/fetch.sh
          cargo build --release -p ortus
      - name: Start Ortus with the sample organisation
        run: |
          token=$(openssl rand -hex 16)
          data=$(mktemp -d)
          # The emulator reaches this machine at 10.0.2.2.
          ORTUS_ROLES=web,worker ORTUS_DATA_DIR="$data" ORTUS_WEB_IP=0.0.0.0 ORTUS_WEB_PORT=7900 \
            ORTUS_PUBLIC_URL=http://10.0.2.2:7900 ORTUS_SETUP_TOKEN="$token" \
            nohup program/target/release/ortus serve > "$data/ortus.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fs http://127.0.0.1:7900/api/v1/health > /dev/null && break; sleep 1; done
          node program/tools/sample-org.mjs http://127.0.0.1:7900 "$token" ministry.example > sample.txt
          sleep $(( 31 - $(date +%s) % 30 ))
          session=$(node --input-type=module -e '
            import { createHmac } from "node:crypto";
            import { readFileSync } from "node:fs";
            const text = readFileSync("sample.txt", "utf8");
            const pass = /password: (.*)/.exec(text)[1].trim(), secret = /authenticator secret: (.*)/.exec(text)[1].trim();
            const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567"; let bits = "";
            for (const c of secret.replace(/=+$/, "").toUpperCase()) bits += abc.indexOf(c).toString(2).padStart(5, "0");
            const key = Buffer.from(bits.match(/.{8}/g).map((b) => parseInt(b, 2)));
            const counter = Buffer.alloc(8); counter.writeBigUInt64BE(BigInt(Math.floor(Date.now() / 30000)));
            const mac = createHmac("sha1", key).update(counter).digest(); const o = mac[19] & 15;
            const totp = String((mac.readUInt32BE(o) & 0x7fffffff) % 1000000).padStart(6, "0");
            const h = { "X-Requested-With": "ortus", "Content-Type": "application/json" };
            const post = async (p, b) => (await fetch("http://127.0.0.1:7900/api/v1" + p, { method: "POST", headers: h, body: JSON.stringify(b) })).json();
            const { ticket } = await post("/session/password", { email: "olena@ministry.example", password: pass });
            const { session_token } = await post("/session/code", { ticket, code: totp });
            console.log(session_token);')
          echo "ORTUS_SCREENSHOT_SESSION=$session" >> "$GITHUB_ENV"
          echo "ORTUS_SERVER=http://10.0.2.2:7900" >> "$GITHUB_ENV"
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots on a 16:9 phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # 1080 x 1920: Play takes no side more than twice the other.
          profile: Nexus 5X
          script: |
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4 -e mobile show -e level 4
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=cc.ortus.app.StoreScreenshots
            mkdir -p screenshots && adb pull /data/local/tmp/ortus-shots/. screenshots/ && ls -la screenshots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots
            app/build/reports
