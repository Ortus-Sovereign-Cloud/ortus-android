name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          # Gradle's downloads kept between runs (Maven Central rate-limits).
          cache: gradle
      # The end-to-end library (Rust, ci/e2e-lib.sh), kept per program pin:
      # built again only when the pin moves.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: e2e
        with:
          path: .deps/e2e
          key: e2e-lib-${{ hashFiles('pins.toml', 'ci/e2e-lib.sh') }}
      - if: steps.e2e.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - if: steps.e2e.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked --version 4.1.2
      - name: The end-to-end library
        run: ci/e2e-lib.sh
      # The whole check: kit tests, the app built, its licence list current
      # (the runner has an Android SDK).
      - run: ci/check.sh

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The program commit the tests run against
        id: pin
        run: echo "ortus=$(sed -n 's/^ortus = "\([0-9a-f]\{40\}\)"$/\1/p' pins.toml)" >> "$GITHUB_OUTPUT"
      - name: The Ortus program at its pinned parts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Ortus-Sovereign-Cloud/ortus
          ref: ${{ steps.pin.outputs.ortus }}
          path: program
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          # Gradle's downloads kept between runs (Maven Central rate-limits).
          cache: gradle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            program/target
          key: ortus-linux-${{ hashFiles('program/pins.toml', 'program/Cargo.lock') }}
          restore-keys: ortus-linux-
      - name: Build Ortus
        run: |
          cd program
          ci/fetch.sh
          cargo build --release -p ortus
      - name: The kit against a real Ortus (S3.2, S1.9, S2.4)
        # Its own installation (the codes are single-use); ORTUS_LIVE=1
        # makes a missing value fail rather than skip.
        run: |
          eval "$(env -u GITHUB_ENV ci/start-ortus.sh program/target/release/ortus | tail -1)"
          ORTUS_LIVE=1 ./gradlew :kit:test --tests '*LiveTest*'
      - name: Start Ortus and invite Iryna
        run: PUBLIC_HOST=10.0.2.2 ci/start-ortus.sh program/target/release/ortus
      # The end-to-end library (Rust, ci/e2e-lib.sh), kept per program pin:
      # built again only when the pin moves.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: e2e
        with:
          path: .deps/e2e
          key: e2e-lib-${{ hashFiles('pins.toml', 'ci/e2e-lib.sh') }}
      - if: steps.e2e.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - if: steps.e2e.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked --version 4.1.2
      - name: The end-to-end library
        run: ci/e2e-lib.sh
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests in the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # On a failure, the app's own log lines say why.
          script: ./gradlew :app:connectedDebugAndroidTest || (adb logcat -d | grep -iE 'ortus|AndroidRuntime|DEBUG|libc|webrtc|jingle|rtc_|Check failed|Fatal' | grep -v ' I DEBUG' | tail -n 400; exit 1)
      # On a failure, whether the test server still answers, and its log.
      - if: failure()
        run: |
          curl -s -m 5 "http://127.0.0.1:${ORTUS_PORT:-0}/api/v1/health" || echo "the test server does not answer"
          tail -n 80 "${ORTUS_LOG:-/dev/null}" | grep -v '"path":' || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: app/build/reports
