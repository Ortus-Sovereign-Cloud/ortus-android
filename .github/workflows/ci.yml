name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Gradle's downloads kept between runs (Maven Central rate-limits).
          cache: gradle
      # The whole check: kit tests, the app built, its licence list current
      # (the runner has an Android SDK).
      - run: ci/check.sh

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: The program commit the tests run against
        id: pin
        run: echo "ortus=$(sed -n 's/^ortus = "\([0-9a-f]\{40\}\)"$/\1/p' pins.toml)" >> "$GITHUB_OUTPUT"
      - name: The Ortus program at its pinned parts
        uses: actions/checkout@v4
        with:
          repository: Ortus-Sovereign-Cloud/ortus
          ref: ${{ steps.pin.outputs.ortus }}
          path: program
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Gradle's downloads kept between runs (Maven Central rate-limits).
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            program/target
          key: ortus-linux-${{ hashFiles('program/pins.toml', 'program/Cargo.lock') }}
          restore-keys: ortus-linux-
      - name: Build Ortus
        run: |
          cd program
          ci/fetch.sh
          cargo build --release -p ortus
      - name: The kit against a real Ortus (S3.2, S1.9, S2.4)
        # Its own installation (the codes are single-use); ORTUS_LIVE=1
        # makes a missing value fail rather than skip.
        run: |
          eval "$(env -u GITHUB_ENV ci/start-ortus.sh program/target/release/ortus | tail -1)"
          ORTUS_LIVE=1 ./gradlew :kit:test --tests '*LiveTest*'
      - name: Start Ortus and invite Iryna
        run: PUBLIC_HOST=10.0.2.2 ci/start-ortus.sh program/target/release/ortus
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # On a failure, the app's own log lines say why.
          script: ./gradlew :app:connectedDebugAndroidTest || (adb logcat -d | grep -iE 'ortus|AndroidRuntime|DEBUG|libc|webrtc|jingle|rtc_|Check failed|Fatal' | grep -v ' I DEBUG' | tail -n 400; exit 1)
      # On a failure, whether the test server still answers, and its log.
      - if: failure()
        run: |
          curl -s -m 5 "http://127.0.0.1:${ORTUS_PORT:-0}/api/v1/health" || echo "the test server does not answer"
          tail -n 80 "${ORTUS_LOG:-/dev/null}" | grep -v '"path":' || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports
