name: verification

# Gradle's dependency checksums (gradle/verification-metadata.xml) for the
# artifacts only another system downloads (the macOS builds of aapt2 and
# the like): run by hand; its artifact is the file as Gradle writes it on
# macOS, to compare with Maven Central and Google's Maven and merge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Checksums as Gradle writes them here
        # The end-to-end library is not needed: only Gradle's downloads.
        run: |
          mkdir -p .deps/e2e/kotlin .deps/e2e/jniLibs
          ./gradlew --no-daemon --write-verification-metadata sha256 :kit:test :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest -x lint || true
          git diff --stat gradle/verification-metadata.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-metadata-macos
          path: gradle/verification-metadata.xml
